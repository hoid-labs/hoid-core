name: Publish to GitHub Releases

on:
  push:
    tags:
      - "v*"
  repository_dispatch:
    types: [release]

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve version
        # Pick up the version from whichever trigger fired this workflow.
        # repository_dispatch carries it in client_payload; tag pushes use the tag name.
        id: version
        run: |
          v="${{ github.event.client_payload.version }}"
          if [ -z "$v" ]; then v="${{ github.ref_name }}"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # fetch-depth: 0 is important for hatch-vcs to read the git tags correctly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        env:
          # gh reads GH_TOKEN. On manual tag pushes github.ref_name is the
          # tag; on repository_dispatch it's "main", so the Resolve version
          # step above provides the correct value via the env-passed output.
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            dist/*.whl dist/*.tar.gz \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Upload build artifacts
        # Shared with the publish-pypi job below via the dist artifact name.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-and-release
    # Run on both tag pushes and the repository_dispatch that auto-tag fires
    # (see .github/scripts/auto-tag.sh: tags created via the API don't reliably
    # trigger the `push: tags: v*` event, so auto-tag dispatches a `release`
    # event instead). workflow_dispatch is intentionally not a trigger of
    # this workflow — for the very first publish, run `uv publish` locally
    # with a PyPI token before pushing any tag.
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/hoid
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.10.3
        # First publish: token-based (PYPI_API_TOKEN secret).
        # After the project is claimed on PyPI and trusted publishing is
        # configured there, revert this to the no-`with:` form and delete
        # the secret. Documented in PUBLISH.md.
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
